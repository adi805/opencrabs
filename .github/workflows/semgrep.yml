# Semgrep - the deterministic second layer behind PR-Agent.
#
# Why this file exists: PR-Agent reads logic and intent, but it is a model, and a
# model misses mechanical patterns it has no rule for. Semgrep never reasons: it
# matches known-bad shapes (weak crypto, injection, hardcoded secrets) and fails
# the same way every time. Review catches what is wrong with the change; Semgrep
# catches what is wrong with the code.
#
# Policy: only ERROR-severity findings fail the job. MEDIUM/WARNING findings are
# printed in full (log + job summary) so they stay visible without turning every
# PR red on day one. Tighten by setting STRICT to "true" once the backlog is triaged.
#
# Cost control:
#   - ONE scan, not two: the JSON is produced once and jq renders every view of it
#   - semgrep is version-pinned so CI and the local pre-push gate agree on rules;
#     a floating version means the ruleset can change underneath a green build
#   - concurrency cancels a superseded run instead of queueing it
#
# Security:
#   - contents is read-only; this job only reads the tree
#   - both actions are pinned to a commit SHA, not a tag: a tag is a movable ref,
#     so the code running in this job could change underneath a green build
#   - the workflow needs no secrets, so a fork PR can run it safely
name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    env:
      SEMGREP_VERSION: "1.179.0"
      # "true" = every severity fails the job; "false" = only ERROR fails
      STRICT: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"

      - name: Scan
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --metrics=off \
            --quiet \
            --json --output semgrep.json

      - name: Report and gate
        run: |
          {
            echo "### Semgrep"
            echo
            echo "semgrep ${SEMGREP_VERSION} | policy: STRICT=${STRICT}"
            echo
            echo "| Severity | Rule | Location |"
            echo "| --- | --- | --- |"
            jq -r '.results[] | "| \(.extra.severity) | `\(.check_id | split(".") | last)` | `\(.path):\(.start.line)` |"' semgrep.json | sort
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- findings ---"
          jq -r '.results[] | "\(.extra.severity)\t\(.check_id)\t\(.path):\(.start.line)"' semgrep.json | sort

          if [ "$STRICT" = "true" ]; then
            blocking=$(jq '[.results[]] | length' semgrep.json)
          else
            blocking=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          fi
          echo "blocking findings: $blocking"
          if [ "$blocking" -gt 0 ]; then
            echo "::error::$blocking blocking finding(s). Full list in the job summary."
            exit 1
          fi
