name: Windows binary (artifact)

# Why this file exists: ci.yml's `windows-build` job proves a Windows binary
# COMPILES and STARTS, then throws it away - it never uploads the artifact. So
# nothing produced by this series could actually be run on a Windows machine by
# a human. This is the missing hand-off step: same target, same profile, same
# flags, same toolchain, plus upload-artifact.
#
# It is deliberately a NEW file rather than a step added to ci.yml: ci.yml is
# being edited by the other open PRs in this series, and a new path cannot
# conflict with them or restart their in-flight runs.

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-artifact]

jobs:
  windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    # Same ceiling as ci.yml's windows-build: a COLD run needs ~48 min (33
    # compile incl. llama's cmake C++ plus ~15 for the thin-LTO link), warm
    # from rust-cache lands near 10.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The two tools ci.yml's windows-build also installs: aws-lc-rs needs
      # NASM on Windows, llama-cpp-sys-2 drives CMake.
      - uses: lukka/get-cmake@latest
      - uses: ilammy/setup-nasm@v1

      - name: Build (flags identical to ci.yml windows-build)
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: cargo build --locked --profile ci --target x86_64-pc-windows-msvc --all-features

      - name: Smoke (execute it before shipping it)
        shell: bash
        run: |
          # Actions bash runs with -e: guard the substitution so a failing exe
          # still prints its stderr instead of dying silently (#1759 shape).
          set +e
          ver=$(./target/x86_64-pc-windows-msvc/ci/opencrabs.exe --version 2>&1)
          status=$?
          set -e
          echo "exit=$status version=$ver"
          [ "$status" -eq 0 ] || exit 1
          echo "$ver" | grep -qi opencrabs

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-windows-x64
          path: target/x86_64-pc-windows-msvc/ci/opencrabs.exe
          if-no-files-found: error
          retention-days: 30

      # The gap this series was opened to close: nothing in the repo could show
      # what the TUI actually renders on Windows. These tests drive the real
      # `render` / `switch_mode` / `open_usage_dashboard` path into ratatui's
      # TestBackend - no desktop, no screen-scraping, no Wine emulation - and
      # write one frame per screen to target/ui-dump as a character grid plus
      # run-length style runs. They are #[ignore]d, so they must be asked for
      # explicitly, and they run only after the exe has already been proven to
      # start.
      - name: Dump the real UI (one frame per screen)
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: |
          set +e
          cargo test --locked --profile ci --target x86_64-pc-windows-msvc --all-features \
            --lib ui_snapshot_dump -- --ignored --nocapture
          status=$?
          set -e
          echo "ui-dump exit=$status"
          ls -la target/ui-dump || echo "no target/ui-dump produced"
          exit $status

      - name: Upload the UI dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-ui-dump
          path: target/ui-dump
          if-no-files-found: warn
          retention-days: 30

  # The render dump proves what the app writes into the terminal buffer. It does
  # not prove what a user sees in a window. A probe run (PR#14) settled the open
  # question with receipts: a hosted Windows runner really does have a desktop
  # session (SessionId 2, UserInteractive True, 1024x768 virtual screen), and a
  # console window it launched came back from the capture with legible text
  # ("PROBE_MARKER_12345", "Waiting for 51 seconds"). So photographs are
  # possible here without anybody's PC, and this job takes them: it runs the exe
  # we just built in a visible console sized to the app's own request, drives it
  # with real keystrokes, and shoots the screen after each step.
  #
  # Deliberately fail-soft. Whatever the app happens to show is the finding; an
  # empty capture is still a frame to read, so the job must not go red before the
  # images are uploaded.
  desktop-capture:
    name: Photograph the app on a real Windows desktop
    needs: windows-exe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the exe this run built
        uses: actions/download-artifact@v4
        with:
          name: opencrabs-windows-x64
          path: app

      - name: Launch it in a console window and shoot every step
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $shots = Join-Path $PWD 'shots'
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $exe = (Resolve-Path (Join-Path $PWD 'app\opencrabs.exe')).Path
          "exe: $exe"

          # The window is found by title, so the capture cannot silently shoot
          # some other process's window.
          $sig = @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class U {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          }
          "@
          Add-Type -TypeDefinition $sig -Language CSharp

          function FindTarget {
            Get-Process | Where-Object { $_.MainWindowTitle -like '*OCAP*' } |
              Select-Object -First 1
          }

          function Shoot([string]$tag) {
            $t = FindTarget
            if ($null -eq $t) { "  $tag : no OCAP window found, skipped"; return }
            [void][U]::SetForegroundWindow($t.MainWindowHandle)
            Start-Sleep -Milliseconds 500
            $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
            try {
              $bmp = New-Object System.Drawing.Bitmap($vs.Width, $vs.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($vs.X, $vs.Y, 0, 0, $bmp.Size)
              $file = Join-Path $shots "$tag.png"
              $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
              "  $tag : $((Get-Item $file).Length) bytes (fg=$([U]::GetForegroundWindow()), title='$($t.MainWindowTitle)')"
            } catch { "  $tag : capture FAILED $($_.Exception.Message)" }
          }

          function Send([string]$keys) {
            $t = FindTarget
            if ($null -eq $t) { "  no window, key dropped: $keys"; return }
            [void][U]::SetForegroundWindow($t.MainWindowHandle)
            Start-Sleep -Milliseconds 300
            try { [System.Windows.Forms.SendKeys]::SendWait($keys) }
            catch { "  send FAILED $($_.Exception.Message)" }
            Start-Sleep -Milliseconds 900
          }

          # mode con sizes the buffer BEFORE the app starts, which is the one
          # thing Wine could not do and the reason its frames were garbage.
          $p = Start-Process cmd.exe -ArgumentList '/K', "title OCAP && mode con cols=150 lines=45 && `"$exe`"" -PassThru
          Start-Sleep -Seconds 9
          "started pid=$($p.Id)"
          Shoot "00-boot"

          # A fresh install lands in the wizard. Enter walks it; each press is a
          # frame, so onboarding is photographed even if it never completes.
          for ($i = 1; $i -le 8; $i++) {
            $tag = "{0:d2}-wizard-{1:d}" -f (1 + $i), $i
            Send "{ENTER}"
            Shoot $tag
          }

          # The chat-mode menus. ESC first so an open dialog cannot eat the slash.
          $menus = @('help', 'menu', 'status', 'usage', 'sessions', 'profiles',
                     'providers', 'models', 'health', 'audit')
          $n = 10
          foreach ($m in $menus) {
            $n++
            Send "{ESC}"
            Send "/$m{ENTER}"
            Shoot ("{0:d2}-menu-{1}" -f $n, $m)
          }

          "frames: $((Get-ChildItem $shots -Filter *.png | Measure-Object).Count)"
          Get-ChildItem $shots -Filter *.png | ForEach-Object { "  $($_.Name) $($_.Length)" }
          try { Stop-Process -Id $p.Id -Force -ErrorAction Stop } catch { "stop: $($_.Exception.Message)" }
          Get-Process opencrabs -ErrorAction SilentlyContinue | ForEach-Object {
            try { Stop-Process -Id $_.Id -Force } catch { "child stop failed" }
          }

      - name: Upload the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-windows-desktop
          path: shots
          if-no-files-found: warn
          retention-days: 30
