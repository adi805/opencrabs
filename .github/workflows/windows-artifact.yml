name: Windows binary (artifact)

# Why this file exists: ci.yml's `windows-build` job proves a Windows binary
# COMPILES and STARTS, then throws it away - it never uploads the artifact. So
# nothing produced by this series could actually be run on a Windows machine by
# a human. This is the missing hand-off step: same target, same profile, same
# flags, same toolchain, plus upload-artifact.
#
# It is deliberately a NEW file rather than a step added to ci.yml: ci.yml is
# being edited by the other open PRs in this series, and a new path cannot
# conflict with them or restart their in-flight runs.

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-artifact, feat/windows-desktop]

jobs:
  windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    # Same ceiling as ci.yml's windows-build: a COLD run needs ~48 min (33
    # compile incl. llama's cmake C++ plus ~15 for the thin-LTO link), warm
    # from rust-cache lands near 10.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The two tools ci.yml's windows-build also installs: aws-lc-rs needs
      # NASM on Windows, llama-cpp-sys-2 drives CMake.
      - uses: lukka/get-cmake@latest
      - uses: ilammy/setup-nasm@v1

      - name: Build (flags identical to ci.yml windows-build)
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: cargo build --locked --profile ci --target x86_64-pc-windows-msvc --all-features

      - name: Smoke (execute it before shipping it)
        shell: bash
        run: |
          # Actions bash runs with -e: guard the substitution so a failing exe
          # still prints its stderr instead of dying silently (#1759 shape).
          set +e
          ver=$(./target/x86_64-pc-windows-msvc/ci/opencrabs.exe --version 2>&1)
          status=$?
          set -e
          echo "exit=$status version=$ver"
          [ "$status" -eq 0 ] || exit 1
          echo "$ver" | grep -qi opencrabs

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-windows-x64
          path: target/x86_64-pc-windows-msvc/ci/opencrabs.exe
          if-no-files-found: error
          retention-days: 30

      # The gap this series was opened to close: nothing in the repo could show
      # what the TUI actually renders on Windows. These tests drive the real
      # `render` / `switch_mode` / `open_usage_dashboard` path into ratatui's
      # TestBackend - no desktop, no screen-scraping, no Wine emulation - and
      # write one frame per screen to target/ui-dump as a character grid plus
      # run-length style runs. They are #[ignore]d, so they must be asked for
      # explicitly, and they run only after the exe has already been proven to
      # start.
      - name: Dump the real UI (one frame per screen)
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: |
          set +e
          cargo test --locked --profile ci --target x86_64-pc-windows-msvc --all-features \
            --lib ui_snapshot_dump -- --ignored --nocapture
          status=$?
          set -e
          echo "ui-dump exit=$status"
          ls -la target/ui-dump || echo "no target/ui-dump produced"
          # Same gate as the capture step below, and for the same reason: this job
          # is the evidence that the Windows renderer ran, and a filter that
          # matches no test exits 0. Count the frames, do not trust the exit code.
          frames=$(find target/ui-dump -type f -name '*.txt' 2>/dev/null | wc -l)
          echo "ui-dump frames=$frames"
          if [ "$frames" -eq 0 ]; then
            echo "::error::the UI dump produced no frame files (test exit $status); refusing to hand back an empty artifact"
            exit 1
          fi
          exit $status

      - name: Upload the UI dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-ui-dump
          path: target/ui-dump
          if-no-files-found: error
          retention-days: 30

      # The other half of the same gap, and the one the UI dump cannot close: a
      # render dump is the app's own buffer, not a photograph of a window on a
      # desktop. This asks the OS to paint a window and reads the pixels back, so
      # the artifact is what the window manager actually drew.
      #
      # It opens its own console window (CREATE_NEW_CONSOLE) rather than
      # photographing whatever is on screen: a window the test owns carries known
      # text, so "ink > 0" is a statement about the capture path instead of about
      # the runner's wallpaper. The test measures the ink ratio of every frame and
      # FAILS on a blank one, which is the whole point - PrintWindow returns TRUE
      # for windows it did not paint.
      #
      # It asserts an interactive seat, because a hosted runner was measured to
      # have one (SessionId 2, UserInteractive True) and a silent empty directory
      # would be indistinguishable from a broken capture.
      - name: Capture a real window to PNG
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: |
          set +e
          cargo test --locked --profile ci --target x86_64-pc-windows-msvc --all-features \
            --lib capture_dump -- --ignored --nocapture
          status=$?
          set -e
          echo "capture-dump test exit=$status"
          ls -la target/capture-dump 2>/dev/null || echo "no target/capture-dump directory"
          # An outcome gate, deliberately separate from the test's exit code. The
          # claim this job has to support is "a PNG was photographed", and a green
          # run that wrote nothing is the failure this module keeps meeting: an
          # `--ignored` filter that matches no real test exits 0, cargo prints "ok"
          # for it, and the upload step at most warns. Count the files instead.
          frames=$(find target/capture-dump -type f -name '*.png' 2>/dev/null | wc -l)
          echo "capture-dump frames=$frames"
          if [ "$frames" -eq 0 ]; then
            echo "::error::the capture dump produced no PNG (test exit $status); refusing to hand back an empty artifact"
            exit 1
          fi
          exit $status

      - name: Upload the window captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-windows-captures
          path: target/capture-dump
          if-no-files-found: error
          retention-days: 30

      - name: Drive a real window (injected and posted input)
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        run: |
          set +e
          # --test-threads=1 is not a style choice. These jobs share two pieces of
          # machine-global state: which window holds focus, and where the pointer
          # is. Run concurrently, one job's injected click moves the pointer that
          # another job is asserting was left alone, and a spawned console steals
          # focus from the one about to be typed into -- which that test is
          # written to refuse, so it would fail for a reason that is the runner's
          # fault and not the code's.
          cargo test --locked --profile ci --target x86_64-pc-windows-msvc --all-features \
            --lib input_dump -- --ignored --nocapture --test-threads=1
          status=$?
          set -e
          echo "input-dump test exit=$status"
          ls -la target/input-dump 2>/dev/null || echo "no target/input-dump directory"
          # Same outcome gate as the capture step, same reason: the claim here is
          # "a keystroke visibly changed a captured frame", and that claim needs
          # the before/after pair on disk to be checkable by anyone. A filter that
          # matches nothing exits 0 and prints ok.
          frames=$(find target/input-dump -type f -name '*.png' 2>/dev/null | wc -l)
          echo "input-dump frames=$frames"
          if [ "$frames" -lt 2 ]; then
            echo "::error::the input dump wrote fewer than 2 PNGs (frames=$frames, test exit $status): no before/after pair, so the keystroke claim is unverified"
            exit 1
          fi
          exit $status

      - name: Upload the input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-windows-input
          path: target/input-dump
          if-no-files-found: error
          retention-days: 30

      - name: Drive the app lane (launch, focus, close)
        # `always()` on purpose: this is the only place the three app actions are
        # exercised against a real window, and it is most worth running on a
        # commit whose input step just went red.
        if: always()
        run: cargo test --locked --profile ci --target x86_64-pc-windows-msvc --all-features --lib app_dump -- --ignored --nocapture --test-threads=1
        shell: bash

      - name: Count the app evidence
        if: always()
        run: |
          status=0
          ls -la target/input-dump 2>/dev/null || echo "no target/input-dump directory"
          # Same gate as the input and capture steps, same reason: the claim is
          # "a launched program showed a window, took the foreground, and then
          # stopped being one", and that claim is only checkable if the frames it
          # was measured against are on disk. A filter that matches nothing exits
          # 0 and prints ok, so the count is the test, not the exit code.
          frames=$(find target/input-dump -type f -name 'app-*.png' 2>/dev/null | wc -l)
          echo "app-dump frames=$frames"
          if [ "$frames" -lt 2 ]; then
            echo "::error::the app dump wrote fewer than 2 app-*.png (frames=$frames): no launched-window and focused-window frame, so the app-control claim is unverified"
            exit 1
          fi
          exit $status

      - name: Upload the app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-windows-app
          path: target/input-dump/app-*.png
          if-no-files-found: error
          retention-days: 30
